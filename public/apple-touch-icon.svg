<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff3742;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2c2c54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Rounded rectangle background for iOS -->
  <rect width="180" height="180" rx="40" ry="40" fill="url(#bgGradient)"/>
  
  <!-- Play button circle -->
  <circle cx="90" cy="90" r="50" fill="url(#playGradient)"/>
  
  <!-- Play triangle -->
  <polygon points="75,65 75,115 115,90" fill="white" opacity="0.95"/>
  
  <!-- Streaming waves -->
  <g opacity="0.6">
    <path d="M130 70 Q140 60, 150 70" stroke="url(#playGradient)" stroke-width="4" fill="none"/>
    <path d="M130 90 Q145 75, 160 90" stroke="url(#playGradient)" stroke-width="4" fill="none"/>
    <path d="M130 110 Q140 120, 150 110" stroke="url(#playGradient)" stroke-width="4" fill="none"/>
  </g>
</svg>