<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the play button -->
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff3742;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2c2c54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bgGradient)"/>
  
  <!-- Play button circle -->
  <circle cx="16" cy="16" r="10" fill="url(#playGradient)"/>
  
  <!-- Play triangle -->
  <polygon points="13,11 13,21 21,16" fill="white" opacity="0.95"/>
  
  <!-- Small streaming wave -->
  <path d="M24 12 Q26 10, 28 12" stroke="url(#playGradient)" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M24 16 Q27 13, 30 16" stroke="url(#playGradient)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M24 20 Q26 22, 28 20" stroke="url(#playGradient)" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>