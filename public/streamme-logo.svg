<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the play button -->
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff3742;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f2f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ddd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Play button circle -->
  <circle cx="25" cy="30" r="18" fill="url(#playGradient)" filter="url(#shadow)"/>
  
  <!-- Play triangle -->
  <polygon points="20,22 20,38 32,30" fill="white" opacity="0.95"/>
  
  <!-- Streaming waves -->
  <g opacity="0.7">
    <path d="M45 20 Q50 15, 55 20" stroke="url(#playGradient)" stroke-width="2" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M45 25 Q52 18, 59 25" stroke="url(#playGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M45 30 Q54 21, 63 30" stroke="url(#playGradient)" stroke-width="2" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M45 35 Q52 42, 59 35" stroke="url(#playGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M45 40 Q50 45, 55 40" stroke="url(#playGradient)" stroke-width="2" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- StreamMe Text -->
  <text x="75" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#textGradient)" filter="url(#shadow)">
    Stream
  </text>
  <text x="75" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#playGradient)" filter="url(#shadow)">
    Me
  </text>
  
  <!-- Decorative dots -->
  <circle cx="160" cy="15" r="2" fill="url(#playGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="20" r="1.5" fill="url(#playGradient)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="45" r="2" fill="url(#playGradient)" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="40" r="1.5" fill="url(#playGradient)" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>